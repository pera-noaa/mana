name: MANA tests

on:
  push:
    branches: [ ci-debug-543 ]

jobs:
  e2e:
    name: Ubuntu 26.04
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Ubuntu's MPICH 4.3 runs on UCX (ch4:ucx), as MPICH does on many
      # clusters.
      image: ubuntu:26.04
      # DMTCP turns off address space randomization, which Docker's default
      # seccomp profile forbids; MPICH needs more than 64 MB of /dev/shm.
      options: --security-opt seccomp=unconfined --shm-size=2g
    steps:
      - name: Install packages
        run: |
          apt-get update
          # libc6-dbg: MANA needs the symbols of ld.so, which Ubuntu strips.
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends build-essential gfortran git \
            ca-certificates python3 mpich libmpich-dev libc6-dbg gdb

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        run: |
          git -C dmtcp apply ../dmtcp_ctid.patch
          ./configure
          make -j"$(nproc)" mana

      - name: Test MANA
        run: >
          sh -c "ldd --version | head -1; mpi-proxy-split/test/autotest.py
          --workdir /tmp/autotest threads_idle mmap_threads_quiet mmap_threads"

      - name: Keep the logs of failed tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotest-logs
          path: /tmp/autotest/
          if-no-files-found: ignore
